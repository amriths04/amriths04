<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 600">
  <defs>
    <style>
      .text {
        font-family: 'Segoe Script', cursive;
        font-size: 404px;
        fill: transparent;
        stroke: #1234aeff;
        stroke-width: 5;
        stroke-dasharray: 2000;
        stroke-dashoffset: 2000;
        animation: draw 3.5s ease-in-out infinite, fillIn 3.5s ease-in-out infinite;
      }

      @keyframes draw {
        0%, 10% { stroke-dashoffset: 2000; }
        85.7% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 2000; }
      }

      @keyframes fillIn {
        0%, 30% { fill: transparent; }
        85.7% { fill: #1234aeff; }
        100% { fill: transparent; }
      }

      .bg {
        fill: transparent;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg"/>

  <!-- Text -->
  <text x="50%" y="88%" text-anchor="middle" class="text"> Amrith </text>
</svg>
